<!doctype html>
<html lang="ja" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="高校生向けのおこづかい・買いもの管理アプリ" />

    <!-- ホーム画面に追加して、アプリのように使えるようにする -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="おこづかい" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>おこづかい帳</title>
    <script>
      // Stamp the resolved theme before first paint so there is no flash of the wrong mode.
      try {
        const saved = localStorage.getItem('okozukai:theme')
        const dark =
          saved === '"dark"' ||
          ((!saved || saved === '"system"') &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch {
        /* localStorage が使えない環境ではライトモードのまま */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
