name: Deploy to GitHub Pages

# ビルドした dist/ を GitHub Pages に公開する。
# リポジトリのソースをそのまま配信すると、開発用の index.html
# （src/main.tsx を読み込む TypeScript のまま）が返って画面が真っ白になるため、
# 必ずこのワークフローのビルド結果を公開する。
#
# 【1 回だけ必要な設定】
# GitHub のリポジトリ → Settings → Pages → Build and deployment の
# Source を「GitHub Actions」に変更してください（既定の「Deploy from a branch」のままだと
# こちらのビルド結果は使われません）。

on:
  push:
    branches:
      - main
      - claude/allowance-management-app-t97yhy
  # 「Actions」タブから手動でも実行できるようにする
  workflow_dispatch:

# 同時に走らせない（あとから始まったものを優先）
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 型チェックとビルド
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
